<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier Backend (Connexion)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f9;
        }

        .container-app {
            max-width: 600px;
            min-height: 400px;
        }
    </style>
</head>
<body class="p-4 sm:p-8 flex justify-center items-center min-h-screen">

<div class="container-app bg-white p-8 rounded-xl shadow-2xl w-full">
    <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">
        NUMÉRIQUE POUR TOUTES 2026 <br>
        Atelier Backend
    </h1>

    <!-- ============================================== -->
    <!-- ÉCRAN 1 : PAGE DE CONNEXION (Visible par défaut) -->
    <!-- ============================================== -->
    <div id="login-screen">
        <h2 class="text-xl font-semibold mb-6 text-center text-gray-700">Connexion</h2>
        <form id="login-form" class="space-y-6">

            <div>
                <label for="nom" class="block text-sm font-medium text-gray-700 mb-1">Identifiant</label>
                <input
                        type="text"
                        id="nom"
                        name="nom"
                        required
                        placeholder="Entrez votre nom"
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition duration-150"
                >
            </div>

            <div>
                <label for="mdp" class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
                <input
                        type="password"
                        id="mdp"
                        name="mdp"
                        required
                        placeholder="Mot de passe"
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition duration-150"
                >
            </div>

            <button
                    type="submit"
                    id="login-button"
                    class="w-full px-6 py-3 bg-indigo-600 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-700 transition duration-150 ease-in-out"
            >
                Se connecter
            </button>
        </form>

        <div id="message" class="mt-4 text-center p-3 rounded-lg text-sm hidden"></div>
    </div>


    <!-- ============================================== -->
    <!-- ÉCRAN 2 : PROFIL UTILISATEUR (Caché par défaut) -->
    <!-- ============================================== -->
    <div id="profil-screen" class="hidden">
        <div class="flex flex-col items-center">
            <div class="w-24 h-24 bg-indigo-100 rounded-full flex items-center justify-center text-4xl font-bold text-indigo-600 mb-4">
                <span id="initials"></span>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Bonjour, <span id="profil-prenom"></span> !</h2>
        </div>

        <div class="bg-indigo-50 p-6 rounded-lg border border-indigo-200 space-y-3">
            <p><strong>Nom complet :</strong> <span id="profil-nom-complet" class="font-medium"></span></p>
            <p><strong>ID Utilisateur :</strong> <span id="profil-id" class="text-indigo-700"></span></p>
            <p><strong>Date de Naissance :</strong> <span id="profil-ddn"></span></p>
            <p><strong>Âge :</strong> <span id="profil-age" class="font-medium text-green-700"></span></p>
        </div>

        <button
                id="logout-button"
                class="mt-6 w-full px-6 py-3 bg-red-500 text-white font-semibold rounded-lg shadow-md hover:bg-red-600 transition duration-150 ease-in-out"
        >
            Se déconnecter
        </button>
    </div>
</div>

<!-- Le script JavaScript qui gère la logique -->
<script src="script.js"></script>

</body>
</html>
